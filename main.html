<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UBTECH 舵机 · 普通模式 + 多角度快慢测试</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: #142a38;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            margin: 0;
        }
        .card {
            max-width: 860px;
            width: 100%;
            background: #f2f8ff;
            border-radius: 40px;
            padding: 28px 30px;
            box-shadow: 0 30px 50px rgba(0,20,30,0.7);
            border: 1px solid #9bb7d4;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 500;
            margin: 0 0 8px 0;
            color: #0f3b56;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .badge {
            background: #c44536;
            color: white;
            padding: 4px 18px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .connector-bar {
            background: #deeaf5;
            border-radius: 60px;
            padding: 10px 20px 10px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            margin: 20px 0 25px;
        }
        .led {
            width: 18px;
            height: 18px;
            border-radius: 18px;
            background: #859daf;
            display: inline-block;
            margin-right: 8px;
        }
        .led.green {
            background: #2fad6a;
            box-shadow: 0 0 10px #2fad6a;
        }
        .btn {
            background: white;
            border: 1px solid #90acc9;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }
        .btn-primary {
            background: #2c6f9c;
            border-color: #194b6b;
            color: white;
            box-shadow: 0 8px 14px #2c6f9c60;
        }
        .btn-danger {
            background: #c44536;
            border-color: #922b1e;
            color: white;
        }
        .btn-warning {
            background: #f0b342;
            border-color: #b87e1a;
            color: #1e3a4e;
        }
        .btn-success {
            background: #2b8c6c;
            border-color: #1a6047;
            color: white;
        }
        .btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }
        .btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .section {
            background: white;
            border-radius: 32px;
            padding: 20px 24px;
            margin: 28px 0;
            border: 1px solid #c1d6ec;
        }
        .section-title {
            font-weight: 700;
            font-size: 1.4rem;
            color: #1b4f74;
            margin-top: 0;
            margin-bottom: 20px;
            border-left: 7px solid #c44536;
            padding-left: 18px;
        }
        .param-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            background: #e9f2fa;
            border-radius: 50px;
            padding: 12px 24px;
            margin: 16px 0;
        }
        .param-row label {
            font-weight: 700;
            min-width: 70px;
            color: #1a4a6b;
        }
        input, select {
            background: white;
            border: 1px solid #a1bedb;
            border-radius: 50px;
            padding: 10px 22px;
            font-size: 1rem;
            flex: 1 1 160px;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #c44536;
            box-shadow: 0 0 0 3px rgba(196,69,54,0.25);
        }
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 20px 0 8px;
        }
        .log-panel {
            background: #0b1e2e;
            color: #bae2ff;
            border-radius: 28px;
            padding: 18px 24px;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.8rem;
            height: 170px;
            overflow-y: auto;
            border: 1px solid #2e5677;
            line-height: 1.6;
            margin-top: 20px;
        }
        .mono-tip {
            background: #203e55;
            color: #bbe1ff;
            border-radius: 30px;
            padding: 4px 18px;
            font-size: 0.8rem;
        }
        hr {
            border: 1px solid #b9d1e9;
            margin: 24px 0;
        }
        .flex-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>
        ⚙️ UBTECH 舵机调试
        <span class="badge">普通模式 · 多角度快慢测试</span>
    </h1>

    <!-- 连接区块：无串口选择，只有连接/断开 -->
    <div class="connector-bar">
        <span id="connStatus"><span class="led"></span> 串口未连接</span>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-primary" id="connectBtn">🔌 连接串口</button>
            <button class="btn" id="disconnectBtn" disabled>🔇 断开</button>
        </div>
    </div>

    <!-- 广播改ID专用区块 (0xCD) 保留 -->
    <div class="section">
        <div class="section-title">📢 广播模式 · 修改舵机ID (0xCD)</div>
        <div class="param-row">
            <label>新ID</label>
            <input type="number" id="newServoId" min="1" max="250" value="1" step="1">
            <span class="mono-tip">1~250</span>
        </div>
        <div class="button-group">
            <button class="btn btn-danger" id="broadcastChangeIdBtn">📡 广播修改ID (0xCD, 参数2=新ID)</button>
            <button class="btn" id="broadcastReadIdBtn">📡 广播查询ID (0xD1)</button>
        </div>
        <div style="font-size:0.9rem; background:#e1effb; border-radius:40px; padding:12px 20px; margin-top:15px;">
            💡 使用广播地址 0x00，所有舵机同时响应。修改后建议重新上电。
        </div>
    </div>

    <!-- 普通模式快速测试 (需要输入ID) -->
    <div class="section">
        <div class="section-title">🎯 普通模式 · 快速测试 (需指定ID)</div>
        <div class="param-row">
            <label>舵机ID</label>
            <input type="number" id="targetServoId" min="1" max="250" value="1" step="1">
            <span class="mono-tip">目标ID</span>
        </div>
        <div class="param-row">
            <label>目标角度</label>
            <input type="number" id="testAngle" value="90" min="0" max="180" step="1">
            <span>°</span>
        </div>
        <div class="param-row">
            <label>运动时间</label>
            <input type="number" id="testTime" value="600" min="50" max="5000" step="50">
            <span>ms</span>
        </div>
        <div class="button-group">
            <button class="btn btn-primary" id="normalMoveBtn">📐 绝对转动 (0x01)</button>
            <button class="btn btn-warning" id="normalTorqueOffBtn">💤 脱力 (角度255)</button>
            <button class="btn btn-success" id="normalCenterBtn">🔰 回中90°</button>
            <button class="btn" id="normalReadAngleBtn">📏 读取角度 (0x02)</button>
        </div>
    </div>

    <!-- 简易演示：多角度 + 快慢选择 (同样需要ID) -->
    <div class="section">
        <div class="section-title">📽️ 简易演示 · 多角度 & 快慢调节</div>
        <div class="flex-row" style="margin-bottom:10px;">
            <div class="param-row" style="flex:2;">
                <label>演示速度</label>
                <select id="demoSpeedSelect">
                    <option value="2000">🐢 慢速 (2000ms)</option>
                    <option value="1000" selected>🚶 中速 (1000ms)</option>
                    <option value="400">🐇 快速 (400ms)</option>
                    <option value="150">⚡ 极速 (150ms)</option>
                </select>
            </div>
            <div class="param-row" style="flex:1;">
                <label>重复次数</label>
                <input type="number" id="demoRepeat" value="2" min="1" max="10" step="1">
            </div>
        </div>
        <div class="button-group">
            <button class="btn btn-success" id="demoWaveBtn">🌊 波浪 (0°→90°→180°→90°)</button>
            <button class="btn btn-primary" id="demoSwingBtn">🎭 摇摆 (45°⇄135°)</button>
            <button class="btn btn-warning" id="demoStepBtn">📶 步进 (0° 60° 120° 180°)</button>
            <button class="btn" id="stopSeqBtn">⏹️ 停止序列</button>
        </div>
        <div style="margin-top:12px; background:#e3effa; border-radius:30px; padding:6px 20px;">
            <span>⏱️ 当前演示速度: <span id="speedDisplay">1000</span> ms | 目标ID: <span id="demoIdDisplay">1</span></span>
        </div>
    </div>

    <!-- 日志显示 -->
    <div class="log-panel" id="logPanel">
        [系统] 已准备 — 普通模式，每次命令需指定舵机ID。<br>
    </div>
    <div style="display: flex; justify-content: space-between; margin-top: 12px;">
        <span class="mono-tip">🔹 协议: FA AF ID 命令 参数 校验 ED</span>
        <button class="btn" id="clearLogBtn">🧹 清空日志</button>
    </div>
</div>

<script>
    // ---------- 日志 ----------
    const logPanel = document.getElementById('logPanel');
    function addLog(msg, isTx = false, isRx = false) {
        const prefix = isTx ? '🔵 TX' : (isRx ? '🟢 RX' : '⚪');
        const line = document.createElement('div');
        line.textContent = `[${new Date().toLocaleTimeString()}] ${prefix} ${msg}`;
        logPanel.appendChild(line);
        logPanel.scrollTop = logPanel.scrollHeight;
    }
    document.getElementById('clearLogBtn').addEventListener('click', ()=>{
        logPanel.innerHTML = '[系统] 日志已清除<br>';
    });

    // 速度显示更新
    const demoSpeedSelect = document.getElementById('demoSpeedSelect');
    const speedDisplay = document.getElementById('speedDisplay');
    demoSpeedSelect.addEventListener('change', (e)=>{
        speedDisplay.innerText = e.target.value;
    });
    speedDisplay.innerText = demoSpeedSelect.value;

    // 更新demo ID显示
    const targetServoIdInput = document.getElementById('targetServoId');
    const demoIdDisplay = document.getElementById('demoIdDisplay');
    targetServoIdInput.addEventListener('change', ()=>{
        demoIdDisplay.innerText = targetServoIdInput.value;
    });
    demoIdDisplay.innerText = targetServoIdInput.value;

    // ---------- 串口 (WebSerial) 极简版 ----------
    let port = null;
    let reader = null;
    let writer = null;
    let serialActive = false;
    let readLoopActive = false;

    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const connStatus = document.getElementById('connStatus');

    async function connectSerial() {
        if (serialActive) return;
        try {
            port = await navigator.serial.requestPort();
            await port.open({ baudRate: 115200, dataBits: 8, stopBits: 1, parity: 'none' });

            writer = port.writable.getWriter();
            reader = port.readable.getReader();

            serialActive = true;
            readLoopActive = true;

            connectBtn.disabled = true;
            disconnectBtn.disabled = false;
            connStatus.innerHTML = '<span class="led green"></span> 已连接 (115200)';

            addLog('✅ 串口已连接，普通模式可用');

            readLoop();
        } catch (e) {
            addLog('❌ 连接失败: ' + e.message);
            if (port) {
                try { await port.close(); } catch (_) {}
                port = null;
            }
        }
    }

    async function disconnectSerial() {
        if (!serialActive) return;
        readLoopActive = false;
        serialActive = false;

        try {
            if (reader) {
                await reader.cancel();
                reader = null;
            }
            if (writer) {
                await writer.close();
                writer = null;
            }
            if (port) {
                await port.close();
                port = null;
            }
        } catch (e) {
            addLog('断开异常: ' + e.message);
        } finally {
            connectBtn.disabled = false;
            disconnectBtn.disabled = true;
            connStatus.innerHTML = '<span class="led"></span> 串口未连接';
            addLog('串口已断开');
        }
    }

    async function readLoop() {
        while (serialActive && reader && readLoopActive) {
            try {
                const { value, done } = await reader.read();
                if (done) break;
                if (value && value.length > 0) {
                    const hex = Array.from(value).map(b => b.toString(16).padStart(2,'0').toUpperCase()).join(' ');
                    addLog(`接收 ${value.length}B: ${hex}`, false, true);
                }
            } catch (e) {
                if (serialActive) addLog('读错误: ' + e.message);
                break;
            }
        }
        if (reader) {
            try { await reader.cancel(); } catch (_) {}
            reader = null;
        }
    }

    async function sendRaw(data) {
        if (!serialActive || !writer) {
            addLog('⛔ 串口未连接');
            return false;
        }
        const hex = Array.from(data).map(b => b.toString(16).padStart(2,'0').toUpperCase()).join(' ');
        addLog(`发送 ${data.length}B: ${hex}`, true, false);
        try {
            await writer.write(data);
            return true;
        } catch (e) {
            addLog('发送失败: ' + e.message);
            return false;
        }
    }

    function calcChecksum(cmd) {
        let sum = 0;
        for (let i = 2; i <= 7; i++) sum += cmd[i];
        return sum & 0xFF;
    }

    // 构建普通模式命令 (指定ID)
    function buildNormalCommand(id, cmdCode, p1=0, p2=0, p3=0, p4=0) {
        const buf = new Uint8Array(10);
        buf[0] = 0xFA;
        buf[1] = 0xAF;
        buf[2] = id & 0xFF;
        buf[3] = cmdCode;
        buf[4] = p1 & 0xFF;
        buf[5] = p2 & 0xFF;
        buf[6] = p3 & 0xFF;
        buf[7] = p4 & 0xFF;
        buf[8] = calcChecksum(buf);
        buf[9] = 0xED;
        return buf;
    }

    // 构建广播命令 (保留给改ID用)
    function buildBroadcastCommand(cmdCode, p1=0, p2=0, p3=0, p4=0) {
        return buildNormalCommand(0x00, cmdCode, p1, p2, p3, p4);
    }

    // ---------- 广播改ID (保留) ----------
    document.getElementById('broadcastChangeIdBtn').addEventListener('click', async ()=>{
        const newId = parseInt(document.getElementById('newServoId').value);
        if (newId < 1 || newId > 250) {
            addLog('⚠️ ID须在1~250之间');
            return;
        }
        const cmd = buildBroadcastCommand(0xCD, 0x00, newId, 0x00, 0x00);
        await sendRaw(cmd);
        addLog(`📢 广播修改ID -> 新ID = ${newId}`);
    });

    document.getElementById('broadcastReadIdBtn').addEventListener('click', async ()=>{
        const cmd = buildBroadcastCommand(0xD1, 0,0,0,0);
        await sendRaw(cmd);
        addLog('📡 广播查询ID (0xD1)');
    });

    // ---------- 普通模式功能 ----------
    function getTargetId() {
        return parseInt(document.getElementById('targetServoId').value);
    }

    document.getElementById('normalMoveBtn').addEventListener('click', async ()=>{
        const id = getTargetId();
        const angle = parseInt(document.getElementById('testAngle').value);
        let timeMs = parseInt(document.getElementById('testTime').value);
        if (timeMs < 20) timeMs = 20;
        let timeUnit = Math.floor(timeMs / 18);
        const p3 = (timeUnit >> 8) & 0xFF;
        const p4 = timeUnit & 0xFF;
        const cmd = buildNormalCommand(id, 0x01, angle, 0x00, p3, p4);
        await sendRaw(cmd);
        addLog(`普通转动 ID=${id}: ${angle}°, 时间 ${timeMs}ms`);
    });

    document.getElementById('normalTorqueOffBtn').addEventListener('click', async ()=>{
        const id = getTargetId();
        const cmd = buildNormalCommand(id, 0x01, 255, 0, 0, 0);
        await sendRaw(cmd);
        addLog(`脱力 ID=${id} (角度255)`);
    });

    document.getElementById('normalCenterBtn').addEventListener('click', async ()=>{
        const id = getTargetId();
        let timeMs = parseInt(document.getElementById('testTime').value) || 600;
        let timeUnit = Math.floor(timeMs / 18);
        const p3 = (timeUnit >> 8) & 0xFF;
        const p4 = timeUnit & 0xFF;
        const cmd = buildNormalCommand(id, 0x01, 90, 0, p3, p4);
        await sendRaw(cmd);
        addLog(`回中 ID=${id} 90°`);
    });

    document.getElementById('normalReadAngleBtn').addEventListener('click', async ()=>{
        const id = getTargetId();
        const cmd = buildNormalCommand(id, 0x02, 0, 0, 0, 0);
        await sendRaw(cmd);
        addLog(`读取角度 ID=${id} (0x02)`);
    });

    // ---------- 简易演示函数 (普通模式, 需要ID) ----------
    async function runSequence(angles, baseTimeMs, repeat=1) {
        const id = getTargetId();
        const speedVal = parseInt(demoSpeedSelect.value);
        const timeUnit = Math.floor(speedVal / 18);
        const p3 = (timeUnit >> 8) & 0xFF;
        const p4 = timeUnit & 0xFF;

        for (let r=0; r<repeat; r++) {
            for (let ang of angles) {
                const cmd = buildNormalCommand(id, 0x01, ang, 0x00, p3, p4);
                await sendRaw(cmd);
                await new Promise(res => setTimeout(res, speedVal + 40));
            }
        }
    }

    document.getElementById('demoWaveBtn').addEventListener('click', async ()=>{
        const repeat = parseInt(document.getElementById('demoRepeat').value) || 1;
        addLog(`🌊 波浪序列 ID=${getTargetId()} 重复${repeat}次, 速度${demoSpeedSelect.value}ms`);
        await runSequence([0, 90, 180, 90], demoSpeedSelect.value, repeat);
        addLog('🏁 波浪结束');
    });

    document.getElementById('demoSwingBtn').addEventListener('click', async ()=>{
        const repeat = parseInt(document.getElementById('demoRepeat').value) || 1;
        addLog(`🎭 摇摆序列 ID=${getTargetId()} (45⇄135) 重复${repeat}次`);
        await runSequence([45, 135, 45], demoSpeedSelect.value, repeat);
        addLog('🏁 摇摆结束');
    });

    document.getElementById('demoStepBtn').addEventListener('click', async ()=>{
        const repeat = parseInt(document.getElementById('demoRepeat').value) || 1;
        addLog(`📶 步进序列 ID=${getTargetId()} 0°→60°→120°→180° 重复${repeat}次`);
        await runSequence([0, 60, 120, 180], demoSpeedSelect.value, repeat);
        addLog('🏁 步进结束');
    });

    document.getElementById('stopSeqBtn').addEventListener('click', async ()=>{
        const id = getTargetId();
        const cmd = buildNormalCommand(id, 0x01, 255, 0, 0, 0);
        await sendRaw(cmd);
        addLog(`⏹️ 停止序列 ID=${id} (脱力)`);
    });

    // 连接/断开事件
    connectBtn.addEventListener('click', connectSerial);
    disconnectBtn.addEventListener('click', disconnectSerial);

    window.addEventListener('beforeunload', ()=>{
        if (serialActive) disconnectSerial();
    });

    // 输入限制
    document.getElementById('newServoId').addEventListener('change', function(e) {
        let v = parseInt(e.target.value);
        if (isNaN(v)) v = 1;
        v = Math.min(250, Math.max(1, v));
        e.target.value = v;
    });
    document.getElementById('targetServoId').addEventListener('change', function(e) {
        let v = parseInt(e.target.value);
        if (isNaN(v)) v = 1;
        v = Math.min(250, Math.max(1, v));
        e.target.value = v;
        demoIdDisplay.innerText = v;
    });
    document.getElementById('testAngle').addEventListener('change', function(e) {
        let v = parseInt(e.target.value);
        if (isNaN(v)) v = 90;
        v = Math.min(180, Math.max(0, v));
        e.target.value = v;
    });
    document.getElementById('testTime').addEventListener('change', function(e) {
        let v = parseInt(e.target.value);
        if (isNaN(v)) v = 600;
        v = Math.min(5000, Math.max(50, v));
        e.target.value = v;
    });
</script>
</body>
</html>
